# Umbriel config -> ~/.config/umbriel/config.toml
# Validate with: umbriel config validate
# Reference: https://docs.noctalia.dev/umbriel/
# Commented lines are optional examples, not defaults.

# ==============================================================================
# Environment & includes
# ==============================================================================
[environment]
QT_QPA_PLATFORMTHEME = "qtengine"

[include]
files = []

[include.optional]
files = ["noctalia.toml"]

# Effects presets (also go in [include].files), e.g.:
#   "/usr/share/umbriel/effects/border/pulse/effect.toml"
#   "/usr/share/umbriel/effects/cursor/trail/effect.toml"
#   "/usr/share/umbriel/effects/border/audio/effect.toml"
#   "/usr/share/umbriel/effects/screen/vignette/effect.toml"

# ==============================================================================
# General
# ==============================================================================
[general]
autostart = ["noctalia", "foot"]
# xwayland = false
# xwayland_native_resolution = true   # sharp X11 apps/games on scaled outputs
# xwayland_xsettings = false          # disable to run your own xsettingsd
# xwayland_primary_output = "HDMI-A-1"
# nvidia_sync_workaround = false      # NVIDIA only
# attach_modal_dialogs = false

# [events]
# lid_close = "umbriel msg output-disable eDP-1"
# lid_open = "umbriel msg output-enable eDP-1"

# [screencast]
# disable_dynamic_confirmation = true

# ==============================================================================
# Outputs (run `umbriel outputs` for names/modes)
# ==============================================================================
[output.HDMI-A-1]
mode = "1920x1080@100"
# position = [0, 0]
# scale = 1.25
# vrr = "fullscreen"      # only if your monitor supports VRR
# hdr = "auto"
# sdr_transfer = "gamma22"
# color_profile = "edid"
# sdr_gamut = "srgb"

# ==============================================================================
# Input
# ==============================================================================
[input.keyboard]
numlock_toggle = true
# Layouts in cycle order: US, UK, Russian (standard), Russian (phonetic)
# variant list lines up with layout list (empty = default variant)
layout = "us,gb,ru,ru"
variant = ",,,phonetic"
options = "grp:alt_shift_toggle"   # Alt+Shift cycles layouts

# [input.focus]
# follows_mouse = "sloppy"   # "off", "sloppy", "always"
# hover_raises = false

# [input.touch]
# enabled = true
# map_to_output = "eDP-1"

# ==============================================================================
# Appearance
# ==============================================================================
[appearance.blur]
radius = 2

# [appearance.title_bar]
# mode = "on"          # "on", "negotiated", "forced", "off"
# height = 28
# font = "sans 10"
# title_align = "left"
# button_position = "right"
# buttons = ["minimize", "maximize", "close"]

# [colors]
# backdrop = "#000000FF"

# [colors.title_bar]
# close = "#FF6B6BFF"
# maximize = "#7AA3FFFF"
# minimize = "#FFD166FF"

# [appearance.tab_bar]
# style = "titles"
# height = 24
# hide_when_single = false
# max_tabs = 6
# overflow = "scroll"

# ==============================================================================
# Effects (all off until a preset is included and selected)
# ==============================================================================
# [effects]
# border = "pulse"
# border_unfocused = true
# cursor = "trail"
# screen_cast = "vignette"

# [effects.pool.borders]
# kind = "border"
# choose = ["pulse"]
# selection = "unused_first"   # or round_robin, random

# ==============================================================================
# Layout
# ==============================================================================
[layout]
# mode = "scrolling"   # "scrolling", "dwindle", "master", "stacking"
extent_presets = [0.333, 0.5, 0.667]
# client_maximize = "column"

[layout.scrolling]
default_extent_fraction = 0.5
# center_on_overview_select = true

[layout.stacking]
# drop_zones = false

# [layout.tabs]
# default_display = "normal"
# new_tab_position = "after_active"
# middle_click_closes = true

# ==============================================================================
# Keybinds (this table REPLACES the built-in set)
# ==============================================================================
[keybinds]

# --- Apps & session
"Mod+Return" = { action = "spawn kitty", repeat = false }
"Mod" = "spawn noctalia msg panel-toggle launcher"
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# --- Quick access
# Emoji picker: opens the launcher pre-filled with /emo
"Mod+Period" = { action = "spawn noctalia msg panel-toggle launcher /emo", repeat = false }
# App shortcuts
"Mod+E" = { action = "spawn dolphin", repeat = false }
"Mod+W" = { action = "spawn zen-browser", repeat = false }
"Mod+D" = { action = "spawn vesktop", repeat = false }
# Screenshots: region select / fullscreen (focused monitor)
"Mod+S" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Mod+Shift+S" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }

# Cycle keyboard layout (us -> gb -> ru -> ru phonetic)
"Mod+Shift+K" = "keyboard-layout-next"

# --- Media / volume / brightness (via Noctalia OSDs)
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }

# --- Focus
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+F1" = "window-focus-next"
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"

# --- Move
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"

# --- Window state
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false }

# --- Sizing
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Minus" = "window-modify-primary-extent -0.02"
"Mod+Equal" = "window-modify-primary-extent +0.02"
"Mod+Ctrl+Minus" = "window-modify-secondary-extent -0.02"
"Mod+Ctrl+Equal" = "window-modify-secondary-extent +0.02"

# --- Columns & tabs
"Mod+Shift+Comma" = "window-consume-left"     # moved from Mod+Comma
"Mod+Shift+Period" = "window-consume-right"    # moved from Mod+Period
"Mod+Ctrl+Comma" = "window-consume-from-left"
"Mod+Ctrl+Period" = "window-consume-from-right"
"Mod+Shift+W" = { action = "column-toggle-tabbed", repeat = false }  # moved from Mod+W
"Mod+Alt+Right" = "column-focus-tab-next"
"Mod+Alt+Left" = "column-focus-tab-previous"
# "Mod+Alt+T" = "layout-toggle-split"   # needs layout.mode = "dwindle"

# --- Overview
"Mod+O" = { action = "overview-toggle", repeat = false }

# --- Workspaces
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+Shift+9" = "window-move-to-workspace 9"
# "Mod+Ctrl+Page_Down" = "workspace-move-to-output-next"
# "Mod+Ctrl+Page_Up" = "workspace-move-to-output-previous"

# --- Scratchpad
"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false }
"Mod+Tab" = "scratchpad-focus-next"

# --- Effects (uncomment with the effects presets)
# "Mod+Shift+E" = "effect-border-cycle borders"
# "Mod+Ctrl+E" = "effect-border-toggle"
# "Mod+Alt+E" = "effect-border-reset"

# ==============================================================================
# Window rules (later rules override earlier ones)
# ==============================================================================

# Global: blur every window
[[window_rule]]
blur = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

